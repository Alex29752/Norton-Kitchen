<!doctype html>
<html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<meta charset="utf-8">
<title>Norton Kitchen</title>
<meta name="theme-color" content="#F6F3F1">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style id="app-css">
:root{
  --ground:#F6F3F1;--surface:#FFFFFF;--surface-2:#EFEAE7;--overlay:rgba(38,33,42,.45);
  --ink:#26212A;--ink-2:#6B6169;--ink-3:#766C74;--line:#D6CFCB;--line-2:#C6BDB8;
  --accent:#6E2F52;--accent-ink:#52223D;--accent-soft:#F3E6EE;--on-accent:#FFFFFF;
  --olive:#4F6B3A;--clay:#A85B32;--clay-soft:#F7EBE2;--alert:#9E2B25;--alert-soft:#F8E5E3;
  --shadow:0 1px 2px rgba(38,33,42,.05),0 10px 30px -14px rgba(38,33,42,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#17141A;--surface:#211C26;--surface-2:#2C2633;--overlay:rgba(0,0,0,.62);
  --ink:#F2EDF0;--ink-2:#B7AEB9;--ink-3:#8E8494;--line:#352E3C;--line-2:#4A4152;
  --accent:#E093B8;--accent-ink:#F0B9D3;--accent-soft:#33202C;--on-accent:#1B0E16;
  --olive:#9CC27E;--clay:#E0A06A;--clay-soft:#2E2419;--alert:#F09189;--alert-soft:#3B1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --ground:#17141A;--surface:#211C26;--surface-2:#2C2633;--overlay:rgba(0,0,0,.62);
  --ink:#F2EDF0;--ink-2:#B7AEB9;--ink-3:#8E8494;--line:#352E3C;--line-2:#4A4152;
  --accent:#E093B8;--accent-ink:#F0B9D3;--accent-soft:#33202C;--on-accent:#1B0E16;
  --olive:#9CC27E;--clay:#E0A06A;--clay-soft:#2E2419;--alert:#F09189;--alert-soft:#3B1E1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 0 9px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:23px;margin:0;
  letter-spacing:0;flex:1;line-height:1.1}
.status{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;display:flex;align-items:center;gap:5px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.status[data-s="saved"]{color:var(--olive)} .status[data-s="saved"] .dot{background:var(--olive)}
.status[data-s="saving"]{color:var(--clay)} .status[data-s="saving"] .dot{background:var(--clay)}
.status[data-s="ro"]{color:var(--clay)} .status[data-s="ro"] .dot{background:var(--clay)}
.status[data-s="err"]{color:var(--alert)} .status[data-s="err"] .dot{background:var(--alert)}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;background:none;border:0;
  border-radius:12px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  margin:22px 0 7px;display:flex;align-items:baseline;gap:8px}
.eyebrow .n{font-weight:600;letter-spacing:.04em;color:var(--ink-3);text-transform:none;font-size:11.5px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:9px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;
  text-align:left;font-family:inherit;font-size:15px;color:var(--ink);box-shadow:var(--shadow)}
.rowbtn:hover{border-color:var(--line-2)}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn .t{display:block;font-weight:500;line-height:1.3}
.rowbtn .s{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.rowbtn .s.empty{color:var(--accent);font-weight:600}
.rowbtn .star{flex:none;color:var(--clay);font-size:15px;line-height:1}
.when{width:42px;flex:none;font-size:11px;color:var(--ink-3);font-weight:700;line-height:1.2;
  text-transform:uppercase;letter-spacing:.06em}
.when i{display:block;font-style:normal;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;
  font-weight:500;letter-spacing:0}
.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.today .when i,.today .when{color:var(--accent)}
.lo{background:var(--clay-soft);border-color:var(--line)}
.th{width:52px;height:52px;flex:none;border-radius:13px;overflow:hidden;display:block;position:relative}
.th svg,.th img{width:100%;height:100%;display:block;object-fit:cover}
.banner{width:100%;height:172px;border-radius:18px;overflow:hidden;display:block;margin-bottom:14px;position:relative}
.banner svg,.banner img{width:100%;height:100%;display:block;object-fit:cover}
.chip{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;
  min-height:44px;padding:0 15px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tagpill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;
  border-radius:6px;background:var(--surface-2);color:var(--ink-2);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 16px;
  border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;
  text-decoration:none;border:0;cursor:pointer;font-family:inherit;width:100%;text-align:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:9px;margin-top:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:12px;padding:12px 13px;min-height:48px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;
  max-height:92vh;display:none;flex-direction:column;box-shadow:0 -10px 40px -14px rgba(0,0,0,.45)}
.sheet.open{display:flex}
.sheet .head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .head h3{font-family:"Instrument Serif",Georgia,serif;font-size:21px;font-weight:400;margin:0;flex:1;line-height:1.2}
.sheet .body{overflow-y:auto;padding:14px 16px calc(26px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.x{background:none;border:0;width:44px;height:44px;flex:none;font-size:27px;line-height:1;color:var(--ink-3);
  cursor:pointer;font-family:inherit;border-radius:12px}
.ilist{list-style:none;margin:6px 0 0;padding:0}
.ilist li{display:flex;gap:11px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.ilist li:first-child{border-top:0}
.ilist .q{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:80px;flex:none;font-weight:600}
.ilist li.st .n{color:var(--ink-3)}
.box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line-2);display:grid;place-items:center}
.rowbtn[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.rowbtn[aria-pressed="true"] .t{text-decoration:line-through;color:var(--ink-3)}
.box svg{opacity:0;width:14px;height:14px}
.box.part{border-color:var(--clay);position:relative}
.box.part:after{content:"";position:absolute;width:12px;height:3px;border-radius:2px;background:var(--clay)}
.rowbtn .box.part+.grow .s{color:var(--clay);font-weight:600}
.fzn .s{color:var(--olive);font-weight:600}
.fzrow .s b{color:var(--ink-2);font-weight:600}
.shoprow{padding:0;gap:0;cursor:default;align-items:stretch}
.shoprow>button{background:none;border:0;font-family:inherit;color:inherit;cursor:pointer;text-align:left;font-size:15px;padding:0}
.shoprow .boxbtn{width:54px;flex:none;display:grid;place-items:center;border-radius:16px 0 0 16px}
.shoprow .grow{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 2px;min-height:62px;border-radius:0 16px 16px 0}
.shoprow .grow>span:first-child{flex:1;min-width:0}
.shoprow .chev{flex:none;color:var(--ink-3);font-size:20px;line-height:1}
.shoprow.done .box{background:var(--accent);border-color:var(--accent)}
.shoprow.done .box svg{opacity:1}
.shoprow.done .t{text-decoration:line-through;color:var(--ink-3)}
.shoprow.part .s{color:var(--clay);font-weight:600}
.snackrow{background:var(--accent-soft);border-color:var(--line);min-height:56px}
.snackrow .th{width:44px;height:44px;border-radius:11px}
.snackrow .s{color:var(--accent-ink)}
.rowbtn[aria-pressed="true"] .box svg{opacity:1}
.rm{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:21px;line-height:1;
  width:44px;height:44px;font-family:inherit}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;padding:0}
.tab{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-3)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.empty{color:var(--ink-3);font-size:14.5px;padding:26px 12px;text-align:center;line-height:1.55}
.sub{font-size:13.5px;color:var(--ink-2);margin:0 0 12px;line-height:1.5}
.weekhead{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px}
.note{background:var(--clay-soft);color:var(--clay);border-radius:11px;padding:11px 13px;font-size:13.5px;
  margin-bottom:12px;line-height:1.45}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.kv span{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:5px 9px;font-weight:500}
.stars{display:flex;gap:2px}
.stars button{width:44px;height:44px;background:none;border:0;cursor:pointer;font-size:23px;line-height:1;
  color:var(--line-2);font-family:inherit;padding:0}
.stars button.on{color:var(--clay)}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;
  background:var(--surface);width:max-content}
.step button{width:46px;height:46px;background:none;border:0;font-size:20px;color:var(--ink);cursor:pointer;font-family:inherit}
.hhbar{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin:0 0 6px}
.hhbar .grow{flex:1;min-width:0}.hhbar .t{display:block;font-weight:600;color:var(--accent-ink)}.hhbar .s{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.ilist li.ih{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:14px;border-top:0}
.inlink{background:none;border:0;padding:0 0 0 6px;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:none}
.steps li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.steps li:first-child{border-top:0}
.steps .sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px}
.steps li.sh{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:16px;border-top:0}
.tips{background:var(--surface-2);border-radius:14px;padding:4px 14px;margin-top:16px}
.tips p{font-size:14px;line-height:1.5;color:var(--ink-2);margin:9px 0}
.tips p.th2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:14px}
.src{margin:4px 0 10px}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 6px 4px;margin-bottom:10px;box-shadow:var(--shadow)}
.daycard.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.dayhead{display:flex;align-items:center;gap:10px;padding:6px 8px 8px;flex-wrap:wrap}
.dayhead .when{width:auto;display:flex;align-items:baseline;gap:5px}
.dayhead .when i{display:inline;font-size:17px}
.dayhead .dname{font-weight:600;flex:1;min-width:0}
.daycard.today .when,.daycard.today .when i,.daycard.today .dname{color:var(--accent)}
.tots{display:flex;gap:5px;flex-wrap:wrap}
.tot{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot.ok{background:color-mix(in srgb,var(--olive) 16%,transparent);color:var(--olive)}
.tot.lo{background:var(--clay-soft);color:var(--clay)}
.slot{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;padding:7px 8px;background:none;border:0;border-top:1px solid var(--line);
  cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);border-radius:12px}
.slot:hover{background:var(--surface-2)}
.slot .grow{flex:1;min-width:0}
.slot .lab{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.slot .t{display:block;font-weight:500;font-size:15px;line-height:1.3}
.slot .s{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.slot .empty{color:var(--accent);font-weight:600;padding:0;font-size:14px}
.slot.din .lab{color:var(--accent)}
.th.sm{width:42px;height:42px;border-radius:11px}
.th.ph{background:var(--surface-2)}
.opage{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;background:#fff}
.gate{max-width:460px;margin:30px auto 0}
.gate h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;margin:0 0 10px}
.how{margin-top:18px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.how summary{cursor:pointer;font-weight:600}
.how ol{padding-left:20px;margin:10px 0;line-height:1.55;font-size:14.5px}
.step b{min-width:56px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.rowbtn,.chip,.tab,.iconbtn{transition:background-color .13s,border-color .13s,color .13s}}
/* ---- tablet: side rail + two columns ---- */
@media (min-width:820px){
  body{padding-bottom:0;padding-left:212px}
  .wrap{max-width:860px;padding:0 28px}
  header{padding-top:18px}
  nav{left:0;right:auto;top:0;bottom:0;width:212px;border-top:0;border-right:1px solid var(--line);
    background:var(--surface);padding:calc(20px + env(safe-area-inset-top)) 12px 0}
  nav .wrap{display:block;max-width:none;padding:0}
  nav:before{content:"";display:block;height:8px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;width:100%;min-height:50px;padding:0 12px;
    border-radius:12px;font-size:15px;font-weight:500;margin-bottom:4px}
  .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .cols>.weekhead,.cols>.eyebrow,.cols>.btnrow,.cols>.chips,.cols>.sub,.cols>.empty{grid-column:1/-1}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);
    border-radius:22px;max-height:86vh}
  .banner{height:220px}
}
</style>

<header><div class="wrap"><div class="brand">
  <h1>Norton Kitchen</h1>
  <span class="status" id="status" data-s="idle"><span class="dot"></span><span id="statusText">Loading</span></span>
  <button class="iconbtn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"></path></svg></button>
</div></div></header>
<main class="wrap" id="app"></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="head"><h3 id="sheetTitle"></h3><button class="x" id="sheetClose" aria-label="Close">×</button></div>
  <div class="body" id="sheetBody"></div>
</div>
<input type="file" id="photoInput" accept="image/*" hidden="">
<input type="file" id="csvInput" accept=".csv,text/csv" hidden="">

const parseD=function(s){var p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};

const addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};

/* ---------- local (per device) bits ---------- */
function lsGet(k,d){ try{var v=localStorage.getItem(k); return v==null?d:JSON.parse(v)}catch(e){return d} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
const weekMon=function(d){ var t=parseD(d); return addDays(d, -((t.getDay()+6)%7)) };
const weekSun=function(d){ return addDays(weekMon(d),6) };

/* shopping ticks live in the shared state, one per ingredient per week,
   so a week ticked off simply reduces what is left in the month */
function gotKey(k,m){ return k+"@"+m }
function isGot(k,m){ var v=STATE.got&&STATE.got[gotKey(k,m)]; return v===1||v===true }
function gotAmt(k,m,need){ var v=STATE.got&&STATE.got[gotKey(k,m)];
  if(!v) return 0; if(v===1||v===true) return need; return Math.min(need,+v.b||0) }
function setGot(k,m,v){ if(!STATE.got) STATE.got={};
  if(v) STATE.got[gotKey(k,m)]=1; else delete STATE.got[gotKey(k,m)] }

/* snacks: one batch a week, prepped on the Sunday, keyed by that date */
function snackOn(sun){ return (STATE.snacks&&STATE.snacks[sun])||null }
function isSweet(r){ return !!(r&&r.sw) }
function applyTheme(){ var t=lsGet("nk_theme","auto");
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t); }

/* ---------- night records ---------- */
function night(d){ if(!STATE.nights) STATE.nights={}; return STATE.nights[d]||null }
function setNight(d,fn){ if(!STATE.nights) STATE.nights={};
  var n=STATE.nights[d]||{}; fn(n);
  if(!n.note&&!n.s&&!n.lo&&!n.done&&!n.fz) delete STATE.nights[d]; else STATE.nights[d]=n; }
function hh(){ var v=+STATE.hh; return v>=1?v:2 }
function servesFor(d,r){ var n=night(d); if(n&&typeof n.s==="number") return n.s; return r?hh():0 }

/* ---------- saving ---------- */
function setStatus(s,t){ var el=$("#status"); if(!el)return; el.dataset.s=s; $("#statusText").textContent=t }
function queueSave(){ if(!canWrite){setStatus("ro","View only");return}
  dirty=true; setStatus("saving","Saving"); clearTimeout(saveTimer); saveTimer=setTimeout(function(){doSave()},900) }
async function doSave(extra){
  if(GHMODE) return ghSave();
  if(standalone){
    try{ lsSet("nk_state",STATE); dirty=false; setStatus("saved","On this device") }
    catch(e){ setStatus("err","Storage full") }
    return;
  }
  if(!API||!canWrite) return;
  var payload=JSON.stringify(STATE);
  if(filesOk){
    var files={"data/state.json":{content:payload,contentType:"application/json"}};
    if(extra) for(var k in extra) files[k]=extra[k];
    try{ await API.publish(files); dirty=false; setStatus("saved","Saved"); return }
    catch(e){
      var c=(e&&e.code)||"upstream_error";
      if(c==="conflict"){ setStatus("saving","Reloading"); return }
      if(c==="not_writer"||c==="not_granted"||c==="not_declared"){ canWrite=false; setStatus("ro","View only"); render(); return }
      if(c==="rate_limited"){ clearTimeout(saveTimer); saveTimer=setTimeout(function(){doSave()},4000); return }
      if(c==="too_large"){ setStatus("err","Photo too big"); return }
      filesOk=false;
    }
  }
  try{ await API.publish(TEMPLATE.replace("__STATE__", payload.replace(/<\//g,"<\\/"))); dirty=false; setStatus("saved","Saved") }
  catch(e2){ var c2=(e2&&e2.code)||"";
    if(c2==="conflict"){ setStatus("saving","Reloading"); return }
    if(c2==="not_writer"||c2==="not_granted"){ canWrite=false; setStatus("ro","View only"); render(); return }
    setStatus("err","Not saved") }
}

function shrink(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*s)||1; c.height=Math.round(h*s)||1;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){ URL.revokeObjectURL(url); b?res(b):rej({code:"encode"}) },"image/jpeg",q);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej({code:"read"}) };
    img.src=url;
  });
}

/* ---------- ingredients ---------- */
const UNITS="kg|g|ml|l|tbsp|tbs|tsp|cups?|cloves?|cans?|tins?|bunch(?:es)?|pinch(?:es)?|sprigs?|rashers?|slices?|packs?|punnets?|each|x";
function isStaple(n){ return STAPLES.indexOf(String(n||"").toLowerCase())>-1 }
function parseIng(text){
  return text.split(/\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(line){
    if(line.indexOf("## ")===0) return {h:line.slice(3).trim()};
    var m=line.match(new RegExp("^(\\d+(?:[.,]\\d+)?|\\d+\\/\\d+)?\\s*("+UNITS+")?\\b\\s*(?:of\\s+)?(.+)$","i"));
    var q=null,u="",n=line;
    if(m){ if(m[1]){ var s=m[1].replace(",",".");
        q=s.indexOf("/")>-1?(function(){var p=s.split("/");return Math.round(p[0]/p[1]*100)/100})():parseFloat(s) }
      u=(m[2]||"").toLowerCase(); n=(m[3]||line).trim() }
    if(u==="tbs")u="tbsp"; if(u==="l")u="L"; if(u==="ml")u="mL";
    n=n.replace(/^[,\-\s]+/,"").replace(/\s+/g," ");
    return {n:n,q:q,u:u,a:AISLES[n.toLowerCase()]||"Other",st:isStaple(n)};
  });
}
function niceFrac(q){
  if(q>0&&q<0.1) return String(Math.round(q*100)/100);
  var w=Math.floor(q+1e-9), r=q-w, F=[[0,""],[0.125,"⅛"],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[1,""]], best=F[0];
  F.forEach(function(x){ if(Math.abs(x[0]-r)<Math.abs(best[0]-r)) best=x });
  if(best[0]===1){ w++; best=F[0] }
  if(w===0&&best[0]===0) best=F[1];
  return (w?String(w):"")+best[1]||"0";
}
function fmtQ(q,u){
  if(q==null||q==="") return u||"";
  if(u==="g"&&q>=1000) return (Math.round(q/100)/10)+" kg";
  if(u==="mL"&&q>=1000) return (Math.round(q/100)/10)+" L";
  if(u==="each"||!u){ q=q<0.25?0.25:Math.round(q*4)/4; return niceFrac(q) }
  if(u==="cup"||u==="tbsp"||u==="tsp"||u==="handful"||u==="slice"||u==="clove"||u==="serve"||u==="scoop"){
    var b=u==="clove"||u==="slice"?Math.max(0.5,Math.round(q*2)/2):q; return niceFrac(b)+" "+u+(u==="cup"&&b>1?"s":"")+(u==="clove"&&b>1?"s":"")+(u==="slice"&&b>1?"s":"") }
  else if((u==="g"||u==="mL")&&q>=20) q=Math.round(q/5)*5;
  else if(u==="g"||u==="mL") q=Math.round(q*10)/10;
  else q=Math.round(q*100)/100;
  return q+(u?" "+u:"");
}

const SLOTN={b:"Breakfast",l:"Lunch",d:"Dinner",s:"Snack"};
const SLOT_ORDER=["b","l","d","s"];
function tgt(){ var t=STATE.tgt||{}; return {p:+t.p>0?+t.p:70,f:+t.f>0?+t.f:25} }
function mealsOn(d){ return (STATE.meals&&STATE.meals[d])||{} }
function slotRec(d,k){ if(k==="d") return STATE.plan[d]?byId(STATE.plan[d]):null; var id=mealsOn(d)[k]; return id?byId(id):null }
function setSlot(d,k,id){
  if(k==="d"){ if(id) STATE.plan[d]=id; else delete STATE.plan[d]; return }
  if(!STATE.meals) STATE.meals={}; var m=STATE.meals[d]||{}; m[k]=id||""; STATE.meals[d]=m }
function pool(k){ return STATE.recipes.filter(function(r){ if(!r.ing||!r.ing.length) return false;
  if(k==="b") return r.tag==="Breakfast"; if(k==="s") return r.tag==="Snack";
  if(k==="l") return r.tag==="Lunch"||((r.ml||[]).indexOf("LUNCH")>-1&&r.tag!=="Breakfast"&&r.tag!=="Snack"); return r.tag==="Dinner" }) }
function dayTotals(d,over){ var p=0,f=0,k=0,n=0; SLOT_ORDER.forEach(function(s){ var r=over&&over[s]!==undefined?over[s]:slotRec(d,s); if(!r) return;
    n++; p+=r.prot||0; f+=r.fib||0; k+=r.kcal||0 }); return {p:p,f:f,k:k,n:n} }
function totPills(d){ var t=dayTotals(d), g=tgt(); if(!t.n) return "";
  return '<span class="tots"><span class="tot '+(t.p>=g.p?"ok":"lo")+'">'+t.p+'/'+g.p+' g protein</span>'
    +'<span class="tot '+(t.f>=g.f?"ok":"lo")+'">'+t.f+'/'+g.f+' g fibre</span></span>' }
function totLine(d){ var t=dayTotals(d), g=tgt();
  return '<p class="sub">This day, per person: <b>'+t.p+' g</b> protein of '+g.p+' g &middot; <b>'+t.f+' g</b> fibre of '+g.f+' g &middot; '+t.k+' kcal.'
    +(t.p<g.p||t.f<g.f?' Short of the target &mdash; try Surprise me on a meal to rebalance.':'')+'</p>' }
function recentIds(d,k,days){ var out={}; for(var i=1;i<=days;i++){ var a=slotRec(addDays(d,-i),k), b=slotRec(addDays(d,i),k); if(a) out[a.id]=1; if(b) out[b.id]=1 } return out }
function pickSlots(d,slots,avoid){ /* choose recipes for the given slots so the day reaches the protein and fibre targets */
  var g=tgt(), P={}, best=null, bestScore=1e9, hits=[];
  slots.forEach(function(k){ var all=pool(k), rec=recentIds(d,k,k==="s"?1:3);
    var p=all.filter(function(r){return !rec[r.id]&&!(avoid&&avoid[r.id])}); P[k]=p.length?p:all });
  for(var t=0;t<400;t++){
    var over={}, ok=true;
    slots.forEach(function(k){ var p=P[k]; if(!p.length){ ok=false; return } over[k]=p[Math.floor(Math.random()*p.length)] });
    if(!ok) break;
    var din=over.d!==undefined?over.d:slotRec(d,"d"); if(over.l&&din&&over.l.id===din.id) continue;
    var tt=dayTotals(d,over), sc=Math.max(0,g.p-tt.p)+2.5*Math.max(0,g.f-tt.f);
    if(sc===0){ hits.push(over); if(hits.length>=12) break }
    if(sc<bestScore){ bestScore=sc; best=over }
  }
  return hits.length?hits[Math.floor(Math.random()*hits.length)]:best;

const SSN_DEFAULT={R01:"hearty",R02:"hearty",R04:"hearty",R07:"light",R08:"hearty",R12:"light",R14:"hearty",R15:"hearty",
 R17:"light",R21:"hearty",R22:"light",R23:"hearty",R24:"light",R25:"light",R26:"hearty",R28:"hearty",R43:"hearty",
 R44:"hearty",R45:"hearty",R46:"hearty",R47:"light",R48:"hearty",R49:"hearty",R51:"light",R52:"hearty",R53:"hearty",
 R55:"hearty",R57:"light",R58:"light",R60:"light",R101:"light",R102:"hearty",R104:"light",R105:"light",R106:"hearty",
 R107:"hearty",R108:"light",R110:"light",R112:"light",R113:"hearty",R114:"hearty",R116:"light",R117:"hearty",
 R118:"light",R119:"hearty",R120:"hearty",R122:"hearty",R124:"light",R125:"light",R126:"light",R127:"hearty",
 R128:"light",R131:"hearty",R132:"light",R133:"light",R135:"light",R136:"hearty",R140:"light",R141:"light",R142:"light"};

const SEASON_W={summer:{light:3,any:2,hearty:0},spring:{light:3,any:2,hearty:0},
                autumn:{light:0,any:2,hearty:3},winter:{light:0,any:2,hearty:3}};
function seasonOf(d){ var m=parseD(d).getMonth();
  return (m===11||m<=1)?"summer":m<=4?"autumn":m<=7?"winter":"spring" }
function seasonLine(d){ var s=seasonOf(d);
  return s+(s==="spring"||s==="summer"?" — fresh, lighter meals":" — warmer, heartier meals") }

/* ---------- months ---------- */
const GEN_DAY=13, FZ_WEEK_CAP=3;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const mKey=function(d){return String(d).slice(0,7)};
const mStart=function(k){return k+"-01"};
const mEnd=function(k){var p=k.split("-").map(Number);return iso(new Date(p[0],p[1],0))};
const mNext=function(k){var p=k.split("-").map(Number);return iso(new Date(p[0],p[1],1)).slice(0,7)};
const mName=function(k){return MONTHS[+k.split("-")[1]-1]};
function cfg(){ if(!STATE.cfg) STATE.cfg={v:0,gen:[]}; if(!STATE.cfg.gen) STATE.cfg.gen=[]; return STATE.cfg }
function planEnd(){ var g=cfg().gen.slice().sort(); return g.length?mEnd(g[g.length-1]):mEnd(mKey(TODAY)) }
function nextGen(){ var cur=mKey(TODAY), late=+TODAY.slice(8)>=GEN_DAY;
  return late?{on:mNext(cur)+"-13",k:mNext(mNext(cur))}:{on:cur+"-13",k:mNext(cur)} }

/* ---------- freezer (only ever filled in by hand) ---------- */
function fzList(){ if(!STATE.freezer) STATE.freezer=[]; return STATE.freezer }
function fzById(id){ return fzList().find(function(f){return f.id===id}) }
function fzPlanned(id){ var out=[];
  Object.keys(STATE.nights||{}).forEach(function(d){ var n=STATE.nights[d];
    if(n&&n.fz===id&&!n.done&&d>=TODAY&&STATE.plan[d]) out.push(d) });
  return out.sort() }
function fzLeft(f){ return Math.max(0,(f.q||0)-fzPlanned(f.id).length) }
function fzTrim(f){ /* more planned than in the freezer: swap the latest ones back to fresh meals */
  var p=fzPlanned(f.id), extra=p.length-Math.max(0,f.q||0), n=0;
  while(extra>0){ var d=p.pop(); if(STATE.nights) delete STATE.nights[d];
    var id=pickFresh(d,{}); if(id) STATE.plan[d]=id; else delete STATE.plan[d]; extra--; n++ }
  return n }
function placeFreezer(cands){
  var ents=fzList().filter(function(f){return byId(f.rid)&&fzLeft(f)>0})
    .sort(function(a,b){return (a.d||"").localeCompare(b.d||"")});      /* oldest first */
  var left=ents.map(fzLeft), q=[], more=true;
  while(more){ more=false; ents.forEach(function(f,i){ if(left[i]>0){ q.push(f); left[i]--; more=true } }) }
  if(!q.length||!cands.length) return 0;
  var wk={}; Object.keys(STATE.nights||{}).forEach(function(d){
    if(STATE.nights[d]&&STATE.nights[d].fz&&STATE.plan[d]){ var m=weekMon(d); wk[m]=(wk[m]||0)+1 } });
  var taken={}, placed=0, step=cands.length/q.length;
  q.forEach(function(f,i){
    var st=Math.min(cands.length-1,Math.floor(i*step+step/2));
    for(var k=0;k<cands.length;k++){ var d=cands[(st+k)%cands.length], m=weekMon(d);
      if(taken[d]||(wk[m]||0)>=FZ_WEEK_CAP) continue;
      taken[d]=1; wk[m]=(wk[m]||0)+1;
      STATE.plan[d]=f.rid; if(!STATE.nights) STATE.nights={}; STATE.nights[d]={fz:f.id}; placed++; break }
  });
  return placed;
}
function isFresh(r){ return r.tag==="Dinner"&&r.ing&&r.ing.length>0 }
function pickFresh(d,used,pref){
  used=used||{};
  var sw=SEASON_W[seasonOf(d)], dow=parseD(d).getDay(), wkend=dow===0||dow===6;
  var near={}; for(var i=-21;i<=21;i++){ if(!i) continue; var x=STATE.plan[addDays(d,i)]; if(x) near[x]=1 }
  var pr=byId(STATE.plan[addDays(d,-1)]), prevArt=pr?pr.art:null;
  var all=STATE.recipes.filter(isFresh);
  function w(r,strict){
    if(used[r.id]) return 0;
    if(strict&&near[r.id]) return 0;
    var s=sw[r.ssn||"any"]; if(s==null) s=2;
    var t=(wkend?{"Slow cook":3,"Big batch":3,"Easy":2,"Quick":1}:{"Quick":3,"Easy":3,"Big batch":1,"Slow cook":1})[r.tag];
    if(t==null) t=1;
    var v=s*t*(r.fav?1.5:1)*((r.rate||0)>=4?1.3:(r.rate&&r.rate<=2)?0.4:1);
    if(prevArt&&r.art===prevArt) v*=0.25;
    if(pref&&r.tag===pref) v*=4;
    return v;
  }
  for(var p=0;p<2;p++){
    var ws=all.map(function(r){return w(r,p===0)}), tot=ws.reduce(function(a,b){return a+b},0);
    if(tot>0){ var x=Math.random()*tot; for(var j=0;j<all.length;j++){ x-=ws[j]; if(x<=0) return all[j].id }
      return all[all.length-1].id }
  }
  var rest=all.filter(function(r){return !used[r.id]});
  return rest.length?rest[Math.floor(Math.random()*rest.length)].id:null;
}
function genRange(a,b){ /* fills only empty nights between a and b */
  if(!STATE.snacks) STATE.snacks={};
  var tk=STATE.recipes.find(function(r){return r.tag==="Takeaway"}), free=[], d;
  for(d=a; d<=b; d=addDays(d,1)){ if(STATE.plan[d]) continue;
    if(tk&&parseD(d).getDay()===4){ STATE.plan[d]=tk.id; continue }
    free.push(d) }
  var fz=placeFreezer(free), used={};
  free.forEach(function(x){ if(STATE.plan[x]) return; var id=pickFresh(x,used); if(id){ STATE.plan[x]=id; used[id]=1 } });
  for(d=a; d<=b; d=addDays(d,1)){ if(parseD(d).getDay()===0&&!snackOn(d)){ var sid=pickSnack(d); if(sid) STATE.snacks[d]=sid } }
  return fz;
}
function autoPlan(){
  if(!canWrite) return false;
  var c=cfg(), changed=false, cur=mKey(TODAY), nxt=mNext(cur), late=+TODAY.slice(8)>=GEN_DAY;
  if(!c.v){ /* one-off switch-over: re-plan from next week on the new rules, two months max */
    var start=TODAY;
    var end=late?mEnd(nxt):mEnd(cur);
    Object.keys(STATE.plan).forEach(function(d){ var n=(STATE.nights||{})[d]||{};
      if(d>=start&&!n.done&&!n.note){ delete STATE.plan[d]; if(STATE.nights) delete STATE.nights[d] } });
    Object.keys(STATE.snacks||{}).forEach(function(d){ if(d>end) delete STATE.snacks[d] });
    var f0=genRange(start,end);
    c.v=1; c.gen=[cur]; if(late) c.gen.push(nxt);
    c.last={m:late?nxt:cur,at:TODAY,fz:f0,from:start}; changed=true;
  }
  var want=[cur]; if(late) want.push(nxt);
  want.forEach(function(k){ if(c.gen.indexOf(k)>-1) return;
    var s=mStart(k); if(s<TODAY) s=TODAY;
    var f1=genRange(s,mEnd(k)); c.gen.push(k); c.last={m:k,at:TODAY,fz:f1}; changed=true });
  var keep=mKey(addDays(TODAY,-62)); c.gen=c.gen.filter(function(k){return k>=keep});
  if(fillMeals(TODAY,planEnd())) changed=true;
  return changed;
}
function fitFreezerNow(){
  var from=addDays(weekMon(TODAY),7), end=planEnd(), cands=[];
  for(var d=from; d<=end; d=addDays(d,1)){ var r=byId(STATE.plan[d]), n=night(d)||{};
    if(!r||r.tag==="Takeaway"||n.fz||n.lo||n.done||n.note||n.s) continue;
    cands.push(d) }
  return placeFreezer(cands);
}

function rangeDates(){
  var t=parseD(TODAY), monday=addDays(TODAY, -((t.getDay()+6)%7));
  if(ui.range==="week"){ return [TODAY, addDays(monday,6)] }
  if(ui.range==="nextweek"){ var s=addDays(monday,7); return [s, addDays(s,6)] }
  if(ui.range==="month"){ return [TODAY, iso(new Date(t.getFullYear(),t.getMonth()+1,0))] }
  return [iso(new Date(t.getFullYear(),t.getMonth()+1,1)), iso(new Date(t.getFullYear(),t.getMonth()+2,0))];
}
function shopItems(){
  var map={},R=rangeDates(),d=R[0],order=["Produce","Meat","Chilled","Frozen","Canned","Sauces","Pantry","Drinks","Other"];
  function add(g,f,mon,use){
    if(g.h||g.r) return;
    var nm=g.k||g.n, k=(nm||"").toLowerCase()+"|"+(g.u||"");
    if(!map[k]) map[k]={n:nm,u:g.u,a:g.a||AISLES[(nm||"").toLowerCase()]||"Other",
                        st:!!g.st||isStaple(g.n),key:k,weeks:{},any:{},uses:[]};
    var m=map[k]; if(use&&m.uses.indexOf(use)<0) m.uses.push(use);
    if(typeof g.q==="number") m.weeks[mon]=(m.weeks[mon]||0)+g.q*f;
    else m.any[mon]=1;
  }
  while(d<=R[1]){
    var day=d; d=addDays(d,1);
    var mon=weekMon(day);
    var rid=STATE.plan[day];
    if(rid){ var n=night(day)||{};
      if(!n.lo&&!n.fz){ var r=byId(rid);
        if(r){ var f=r.serves?servesFor(day,r)/r.serves:1;
          var lab=r.name+" ("+DOW[parseD(day).getDay()]+" "+pretty(day)+")";
          r.ing.forEach(function(g){ add(g,f,mon,lab) }) } } }
    ["b","l","s"].forEach(function(k){ var mr=slotRec(day,k); if(!mr) return;
      var mf=mr.serves?hh()/mr.serves:1, ml=SLOTN[k]+": "+mr.name+" ("+DOW[parseD(day).getDay()]+" "+pretty(day)+")";
      mr.ing.forEach(function(g){ add(g,mf,mon,ml) }) });
  }
  return Object.keys(map).map(function(k){
    var m=map[k], mons={};
    Object.keys(m.weeks).forEach(function(x){mons[x]=1}); Object.keys(m.any).forEach(function(x){mons[x]=1});
    m.mons=Object.keys(mons).sort();
    m.total=0; m.got=0; m.allGot=m.mons.length>0;
    m.mons.forEach(function(x){
      var q=m.weeks[x]||0; m.total+=q;
      if(isGot(k,x)) m.got+=q;
      else { m.got+=gotAmt(k,x,q); if(!(q>0&&gotAmt(k,x,q)>=q&&!m.any[x])) m.allGot=false }
    });
    m.total=(m.u==="each"||!m.u)&&m.total>0?Math.ceil(m.total-1e-9):Math.round(m.total*100)/100; m.got=Math.min(m.total,Math.round(m.got*100)/100);
    m.left=Math.round((m.total-m.got)*100)/100;
    m.part=m.got>0&&!m.allGot;
    m.anyq=Object.keys(m.any).length>0;
    return m;
  }).sort(function(a,b){var x=order.indexOf(a.a),y=order.indexOf(b.a);
      return ((x<0?99:x)-(y<0?99:y))||a.n.localeCompare(b.n)});
}

  else if(i.part) sub=fmtQ(i.left,i.u)+" still to get &middot; "+fmtQ(i.got,i.u)+" already got";
  else sub=i.total?fmtQ(i.total,i.u):(i.anyq?"as needed":"");
  return '<div class="rowbtn shoprow'+(i.allGot?" done":"")+(i.part?" part":"")+'">'
    +'<button class="boxbtn" data-tick="'+esc(i.key)+'" data-weeks="'+esc(i.mons.join(","))+'" aria-pressed="'+i.allGot+'" aria-label="Got all of '+esc(i.n)+'">'
    +'<span class="box'+(i.part?" part":"")+'"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--on-accent)"/></svg></span></button>'

function q(v){ var s=(v==null?"":String(v)); return /[",\n]/.test(s)?'"'+s.split('"').join('""')+'"':s }

  L.push(["NORTON KITCHEN","v4",TODAY].map(q).join(","));

  L.push("RECIPES");

            r.rate||"",r.cook||"",r.last||"",r.art||"",r.photo||"",
            r.tag==="Snack"?(r.sw?"sweet":"savoury"):"",r.ssn||""].map(q).join(","));
  });
  L.push("");

  STATE.recipes.forEach(function(r){ r.ing.forEach(function(i){ if(i.h) return;

  })});
  L.push("");

            n.lo?"yes":"",n.done?"yes":"",n.note||"",n.fz||""].map(q).join(","));
  });
  L.push("");
  L.push("SNACKS");
  L.push("prep_date,recipe_id,recipe,kind");
  Object.keys(STATE.snacks||{}).sort().forEach(function(d){
    var r=byId(STATE.snacks[d]);
    L.push([d,STATE.snacks[d],r?r.name:"",r?(r.sw?"sweet":"savoury"):""].map(q).join(","));
  });
  L.push("");
  L.push("BOUGHT");

  Object.keys(STATE.got||{}).sort().forEach(function(k){
    var at=k.lastIndexOf("@"), v=STATE.got[k];
    L.push([k.slice(0,at),k.slice(at+1),(v&&typeof v==="object")?v.b:""].map(q).join(","));
  });
  L.push("");
  L.push("FREEZER");

  fzList().forEach(function(f){ L.push([f.id,f.rid||"",f.n||"",f.q||0,f.d||"",f.note||""].map(q).join(",")) });
  L.push("");

function parseCSV(text){
  var rows=[],row=[],cell="",i=0,inq=false,c;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(;i<text.length;i++){ c=text[i];
    if(inq){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else inq=false } else cell+=c }
    else if(c==='"') inq=true;
    else if(c===","){ row.push(cell); cell="" }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell="" }
    else cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows;
}
function importCSV(text){
  var rows=parseCSV(text), sec="", head=null, recs=[], byid={}, plan={}, nights={}, extras=[], ings={},
      snacks={}, got={}, freezer=[];
  rows.forEach(function(r){
    var first=(r[0]||"").trim();
    if(!first&&r.length<=1) return;
    if(["RECIPES","INGREDIENTS","PLAN","SNACKS","BOUGHT","FREEZER","EXTRAS"].indexOf(first)>-1 && !(r[1]||"").trim()){ sec=first; head=null; return }
    if(first==="NORTON KITCHEN") return;
    if(!sec) return;
    if(!head){ head=r.map(function(x){return x.trim().toLowerCase()}); return }
    var o={}; head.forEach(function(k,ix){ o[k]=(r[ix]==null?"":r[ix]).trim() });
    if(sec==="RECIPES"&&o.id&&o.name){
      var rec={id:o.id,name:o.name,tag:o.type||"Other",serves:+o.serves||4,
        prot:o.protein?+o.protein:null,url:o.link||"",notes:o.notes||"",
        fav:/^y/i.test(o.favourite||""),rate:+o.rating||0,cook:+o.times_cooked||0,
        last:o.last_cooked||null,art:o.picture||"pot",photo:o.photo||null,ing:[],
        sw:/sweet/i.test(o.sweet||""),
        ssn:o.season===undefined?(SSN_DEFAULT[o.id]||""):(/^(light|hearty)$/.test(o.season)?o.season:"")};
      recs.push(rec); byid[rec.id]=rec;
    }
    if(sec==="INGREDIENTS"&&o.recipe_id&&o.ingredient){
      (ings[o.recipe_id]=ings[o.recipe_id]||[]).push({n:o.ingredient,
        q:o.qty===""?null:+o.qty,u:o.unit||"",a:o.aisle||AISLES[o.ingredient.toLowerCase()]||"Other",
        st:/^y/i.test(o.staple||"")});
    }
    if(sec==="PLAN"&&o.date&&o.recipe_id){
      plan[o.date]=o.recipe_id;
      var n={};
      if(o.serves) n.s=+o.serves;
      if(/^y/i.test(o.leftovers||"")) n.lo=1;
      if(/^y/i.test(o.cooked||"")) n.done=1;
      if(o.note) n.note=o.note;
      if(o.freezer_id) n.fz=o.freezer_id;
      if(Object.keys(n).length) nights[o.date]=n;
    }
    if(sec==="SNACKS"&&o.prep_date&&o.recipe_id) snacks[o.prep_date]=o.recipe_id;
    if(sec==="BOUGHT"&&o.ingredient_key&&o.week_starting) got[o.ingredient_key+"@"+o.week_starting]=o.amount?{b:+o.amount}:1;
    if(sec==="FREEZER"&&o.id) freezer.push({id:o.id,rid:o.recipe_id||null,n:o.meal||"",q:+o.dinners||0,d:o.frozen_on||"",note:o.note||""});
    if(sec==="EXTRAS"&&o.item) extras.push({id:uid("x"),n:o.item,done:/^y/i.test(o.done||"")});
  });
  Object.keys(ings).forEach(function(k){ if(byid[k]) byid[k].ing=ings[k] });
  if(!recs.length) throw new Error("no recipes found");
  Object.keys(plan).forEach(function(d){ if(!byid[plan[d]]) delete plan[d] });
  Object.keys(nights).forEach(function(d){ var n=nights[d], r=byid[plan[d]];
    if(r&&n.s===hh()) delete n.s;
    if(!Object.keys(n).length) delete nights[d] });
  Object.keys(snacks).forEach(function(d){ if(!byid[snacks[d]]) delete snacks[d] });
  freezer.forEach(function(f){ if(f.rid&&!byid[f.rid]) f.rid=null });
  return {v:1,seedv:STATE.seedv,recipes:recs,plan:plan,nights:nights,extras:extras,snacks:snacks,got:got,
          freezer:freezer,cfg:JSON.parse(JSON.stringify(cfg()))};
}

function upgrade(j,SEED){
  if(!j.extras) j.extras=[];
  if(!(+j.hh>=1)) j.hh=2;
  if(!j.nights) j.nights={};
  if(!j.got) j.got={};
  if(!j.freezer) j.freezer=[];
  if(!j.snacks||!Object.keys(j.snacks).length) j.snacks=JSON.parse(JSON.stringify(SEED.snacks||{}));
  /* drop ticks for weeks that finished more than ten weeks ago */
  var cut=addDays(weekMon(TODAY),-70);
  Object.keys(j.got).forEach(function(k){ var m=k.slice(k.lastIndexOf("@")+1); if(m<cut) delete j.got[k] });
  j.recipes.forEach(function(r){ if(!r.art){ var s=SEED.recipes.find(function(x){return x.id===r.id});
      r.art=(s&&s.art)||artFor(r.name,r.tag) }
    if(r.fav==null) r.fav=false; if(r.rate==null) r.rate=0;
    if(r.ssn===undefined) r.ssn=SSN_DEFAULT[r.id]||"";
    if(r.cook==null) r.cook=0; if(r.last===undefined) r.last=null;
    if(r.tag==="Snack"&&r.sw==null){ var sd=SEED.recipes.find(function(x){return x.id===r.id});
      r.sw=sd?!!sd.sw:/sweet|choc|bliss|cookie|energy ball/i.test(r.name) }
    (r.ing||[]).forEach(function(i){ if(!i.h&&i.st==null) i.st=isStaple(i.n) }) });
  if(!j.meals) j.meals={};
  if(j.seedv!==SEED.seedv){
    j.recipes.forEach(function(r){ var sd=SEED.recipes.find(function(x){return x.id===r.id}); if(!sd) return;
      ["ml","pages","url","src","steps","tips","kcal","prot","fib","fat","carb","time","tsub","also"].forEach(function(f){ if(sd[f]!==undefined) r[f]=sd[f] }) });
    var have={}; j.recipes.forEach(function(r){have[r.id]=1});
    SEED.recipes.forEach(function(r){ if(!have[r.id]) j.recipes.push(r) });
    j.seedv=SEED.seedv; return true;
  }
  return false;
}

async function ghGetJSON(path){ /* returns {data,sha} or null when missing */
  var r=await fetch(ghUrl(path)+"?t="+Date.now(),{headers:ghHeaders(false),cache:"no-store"});
  if(r.status===404) return null;
  if(r.status===401||r.status===403) throw {code:"auth"};
  if(!r.ok) throw {code:"net",status:r.status};
  var j=await r.json();
  if(j.content) return {data:JSON.parse(b64dec(j.content)),sha:j.sha};
  var r2=await fetch(ghUrl(path)+"?t="+Date.now(),{headers:ghHeaders(true),cache:"no-store"}); /* large files come back without content */

async function loadImg(job){
  var p=job.p, cache=null, res=null;

  if(!res){
    var r=await fetch(ghUrl(p),{headers:ghHeaders(true)}); if(!r.ok) return;
    var bl=await r.blob();
    res=new Response(bl,{headers:{"Content-Type":"image/jpeg"}});
    try{ if(cache) await cache.put("/img/"+p,res.clone()) }catch(e){}
  }

  try{ var cur=await ghGetJSON("state.json");
    if(cur&&(force||cur.sha!==GH.sha)){ GH.sha=cur.sha; upgrade(cur.data,SEED); STATE=cur.data; if(autoPlan()) queueSave(); render() }
    GH.at=stamp(); setStatus("saved","Synced");
  }catch(e){ setStatus("err","Offline") }
}
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") ghPull(false) });
async function ghStart(){
  GH.error=""; render();
  try{ var changed=await ghLoad(); GH.ready=true; canWrite=true; filesOk=false;
    if(autoPlan()) changed=true; render(); fromHash(); GH.at=stamp(); setStatus("saved","Synced"); if(changed) queueSave();
  }catch(e){
    GH.ready=false;
    GH.error=e&&e.code==="auth"?"That code didn't work. Check it hasn't expired and that it has Contents read and write access to "+GH.repo+".":
      e&&e.code==="norecipes"?"The recipes aren't in "+GH.owner+"/"+GH.repo+" yet.":"Couldn't reach GitHub. Check your connection and try again.";
    if(e&&e.code==="auth"){ try{ localStorage.removeItem("nk_token") }catch(x){} GH.token=null }
    setStatus("err","Not connected"); render();
  }
}
function ghConnect(){ var v=(($("#ghTok")||{}).value||"").trim(); if(!v){ var el=$("#ghTok"); if(el) el.focus(); return }
  GH.token=v; try{ localStorage.setItem("nk_token",v) }catch(e){} ghStart() }

applyTheme();
if(GHMODE){
  try{ GH.token=localStorage.getItem("nk_token") }catch(e){}
  if(GH.token) ghStart(); else { setStatus("idle","Not connected"); render() }
} else {
upgrade(STATE,SEED); render(); setStatus("idle","Loading"); setTimeout(fromHash,0);
(async function(){
  if(!window.claude||!window.claude.use){
    standalone=true; canWrite=true;
    var lj=lsGet("nk_state",null);
    if(lj&&lj.v&&lj.recipes){ upgrade(lj,SEED); STATE=lj }
    setStatus("saved","On this device"); if(autoPlan()) doSave(); render(); return;
  }
})();
}
</script></body></html>
